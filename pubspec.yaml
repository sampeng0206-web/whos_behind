name: whos_behind
description: A new Flutter project for anti-fraud evidence collection.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  url_launcher: ^6.1.14
  image_picker: ^1.0.4
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  intl: ^0.18.1
  image: ^4.1.3
  provider: ^6.0.5
  sqflite_common_ffi: ^2.4.0+3
  http: ^1.6.0
  permission_handler: ^12.0.1
  firebase_core: ^4.8.0
  firebase_storage: ^13.4.0
  geolocator: ^14.0.2
  pdf: ^3.12.0
  printing: ^5.14.3
  google_mobile_ads: ^5.1.0
  purchases_flutter: ^8.0.0
  firebase_remote_config: ^6.5.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  disable-swift-package-manager: true
  uses-material-design: true
  assets:
    - .env
